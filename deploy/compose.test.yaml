# CI end-to-end stack: compose.yaml plus the preview overrides (fakes, fresh database,
# seed), the image built from this checkout, throwaway passwords from test.env, and the
# api published on loopback only (127.0.0.1:8080; TUMNIS_TEST_PORT moves it when 8080 is
# taken, and TUMNIS_IMAGE swaps the image). The database hops use TLS verified against the
# stack's own database CA (db-tls), as in production.
#
# WAL archiving is off and the backup service does not start, as in previews (issue #21: with
# archiving on but no pgBackRest stanza, a failing archive-push restarts Postgres under the
# api). The backup tests opt back in with the compose.test-backups.yaml overlay (the
# rehearsal drill, scripts/drill/restore_drill.sh --mode rehearsal).
#
#   docker compose -f deploy/compose.test.yaml up -d --wait     # Playwright's webServer too
#   docker compose -f deploy/compose.test.yaml down -v
name: tumnis-test

# The image, the api port and the backup profile are set in compose.test-overrides.yaml,
# merged inside the include: this file may only add services (Compose 2.x refuses one that
# the include also defines).
include:
  - path: [compose.yaml, compose.preview.yaml, compose.test-overrides.yaml]
    env_file: test.env

services:
  # MinIO over TLS, repo2 of the opt-in backups (compose.test-backups.yaml): a self-signed
  # certificate (pgBackRest speaks only TLS to S3), the server and its bucket.
  minio-certs:
    build:
      context: ./postgres
      additional_contexts:
        pgbackrest: ./pgbackrest
    image: tumnis-postgres:18
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /certs/public.crt ]; then
          openssl req -new -x509 -days 3650 -nodes -subj /CN=minio \
            -addext subjectAltName=DNS:minio \
            -keyout /certs/private.key -out /certs/public.crt 2>/dev/null
        fi
        chmod 0644 /certs/public.crt /certs/private.key
    volumes:
      - minio_certs:/certs
    restart: "no"
  minio:
    # Same image and digest as the MinIO test fixture (backend/tests/_services.py).
    image: chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    user: "0"
    command: ["server", "/data", "--certs-dir", "/certs"]
    environment:
      MINIO_ROOT_USER: tumnis-test
      MINIO_ROOT_PASSWORD: minio-test-not-a-secret
    volumes:
      - minio_certs:/certs:ro
      - minio_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      minio-certs: { condition: service_completed_successfully }
  minio-bucket:
    profiles: [backups] # only pgBackRest's repo2 needs the bucket
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    command: ["mkdir", "m:tumnis-backups", "--ca-cert", "/certs/public.crt"]
    environment:
      RCLONE_CONFIG_M_TYPE: s3
      RCLONE_CONFIG_M_PROVIDER: Minio
      RCLONE_CONFIG_M_ENDPOINT: https://minio:9000
      RCLONE_CONFIG_M_ACCESS_KEY_ID: tumnis-test
      RCLONE_CONFIG_M_SECRET_ACCESS_KEY: minio-test-not-a-secret
    volumes:
      - minio_certs:/certs:ro
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

volumes:
  minio_certs: {}
  minio_data: {}
