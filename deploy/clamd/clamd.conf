# clamd for Tumnis (P1-16, SEC-10). The extract worker streams each upload to clamd over
# TCP on the compose network (INSTREAM); nothing else reaches it (no host port).
#
# StreamMaxLength must exceed the 50 MiB upload limit (52,428,800 bytes): clamd's default
# (25M) would answer every larger file with a size error, which the pipeline treats as a
# failed scan, never a clean one.
Foreground yes
LogTime yes
LogClean no
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
