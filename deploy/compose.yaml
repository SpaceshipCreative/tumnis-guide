# Self-hosted stack (ADR-0006): migrate, api, worker, Postgres 18 (pgvector, pgBackRest),
# the backup scheduler and PgBouncer. No service publishes a host port: Coolify's proxy reaches the api on the
# Docker network, and Coolify itself is reachable only over the VPN or Tailscale (FR-9.1).
#
# Coolify (or the shell) provides APP_DB_PASSWORD, OWNER_DB_PASSWORD, POSTGRES_PASSWORD and
# TUMNIS_VERSION. Passwords go into connection URLs, so keep them URL-safe (hex);
# deploy/.env.example lists every variable with a placeholder. The optional hosted provider
# keys (SPEECH__HOSTED_*, EMBEDDINGS__HOSTED_*) are not among them: they go in
# deploy/hosted-keys.env, which only the worker reads (see the worker below).
# Backups (P0-28) need /etc/pgbackrest/conf.d/secrets.conf on the host (repo2-s3-key,
# repo2-s3-key-secret, repo2-cipher-pass; root:999, mode 0640), see deploy/README.md.
# /metrics (P0-27) needs /etc/tumnis/secrets/tumnis_metrics_token: the api refuses to start
# in prod without it.
# Overrides: compose.preview.yaml (PR previews), compose.test.yaml (CI e2e stack).
#
# Without Coolify (README, Install): the repository's .env sets COMPOSE_FILE and
# COMPOSE_PROFILES=standalone, which adds the HTTPS proxy below; TUMNIS_BACKUPS=off keeps
# WAL archiving and the backup service idle until the off-site repository is set up
# (docs/OPERATIONS.md, Backups). Unset, both keep the Coolify behaviour.
name: tumnis

x-env: &env
  # TLS on every database hop, verified against the deployment's database CA (db-tls,
  # P0-16, SEC-9); prod refuses to start on anything weaker than verify-full. The api goes
  # through PgBouncer.
  DATABASE_URL: postgresql+psycopg://tumnis_app:${APP_DB_PASSWORD}@pgbouncer:6432/tumnis?sslmode=verify-full&sslrootcert=/etc/tumnis/tls/ca.crt
  # The worker, DBOS and LISTEN use the direct URL (DBOS_SYSTEM_DATABASE_URL defaults to
  # this URL with the database tumnis_dbos).
  DATABASE_DIRECT_URL: postgresql+psycopg://tumnis_app:${APP_DB_PASSWORD}@postgres:5432/tumnis?sslmode=verify-full&sslrootcert=/etc/tumnis/tls/ca.crt
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-prod}
  TUMNIS_ADAPTERS: ${TUMNIS_ADAPTERS:-real}
  # Observability (P0-27): unset keeps GlitchTip off and exports no traces.
  SENTRY_DSN: ${SENTRY_DSN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # The URL people open (https://<host>): the only Origin the sign-in routes accept behind
  # a proxy (P0-13). Empty: the request's own origin.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

x-app: &app
  image: ghcr.io/spaceshipcreative/tumnis:${TUMNIS_VERSION:-latest}
  environment: *env
  volumes:
    - /etc/tumnis/secrets:/run/secrets:ro
    - db_tls_ca:/etc/tumnis/tls:ro # the database CA certificate (sslrootcert)
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["tumnis", "migrate"]
    environment:
      <<: *env
      DATABASE_OWNER_URL: postgresql+psycopg://tumnis_owner:${OWNER_DB_PASSWORD}@postgres:5432/tumnis?sslmode=verify-full&sslrootcert=/etc/tumnis/tls/ca.crt
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    command: ["tumnis", "api"]
    environment:
      <<: *env
      METRICS_TOKEN_FILE: /run/secrets/tumnis_metrics_token # bearer for /metrics (P0-27)
    volumes:
      - /etc/tumnis/secrets:/run/secrets:ro
      - db_tls_ca:/etc/tumnis/tls:ro
      - spool:/var/lib/tumnis/spool # uploads wait here for worker-extract (P1-16)
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    expose: ["8080"]

  worker:
    <<: *app
    command: ["tumnis", "worker"]
    environment:
      <<: *env
    # Optional hosted speech and embedding providers (Scott decisions 75 and 90): only the
    # worker calls them, so only the worker reads deploy/hosted-keys.env, which holds just
    # their SPEECH__HOSTED_* and EMBEDDINGS__HOSTED_* variables (hosted-keys.env.example).
    # Without the file the worker gets none of them, so an image older than these settings
    # still starts under this file (rollback, REL-4). A preview refuses a key.
    env_file:
      - path: hosted-keys.env
        required: false
    volumes:
      - /etc/tumnis/secrets:/run/secrets:ro
      - db_tls_ca:/etc/tumnis/tls:ro
      # S3 linked-source objects (P3-13) and vault attachments (P3-12) wait here for
      # worker-extract, as the api's uploads do.
      - spool:/var/lib/tumnis/spool
      - obsidian:/var/lib/tumnis/obsidian # Git vault clones (P3-12)
    # A running git command's deploy key and known_hosts (GitReader, <obsidian_dir>/.keys)
    # live in memory, private to tumnis, never on the obsidian volume: a worker killed
    # mid-command leaves no key behind once its container restarts.
    tmpfs:
      - /var/lib/tumnis/obsidian/.keys:uid=10001,mode=0700,size=1m,noexec,nosuid,nodev
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Upload scanning and extraction (P1-16, SEC-10): the only process that dequeues the
  # `extract` queue, and the only one that runs Docling. It reads the uploads the api spooled,
  # works in its own scratch volume and asks clamd to scan each file before anything else
  # reads it. One conversion at a time, under a memory limit so a large PDF cannot take the
  # host down.
  worker-extract:
    <<: *app
    command: ["tumnis", "worker", "--queues", "extract"]
    mem_limit: 4g
    environment:
      <<: *env
      KNOWLEDGE__CLAMD_HOST: clamd
    volumes:
      - /etc/tumnis/secrets:/run/secrets:ro
      - db_tls_ca:/etc/tumnis/tls:ro
      - spool:/var/lib/tumnis/spool
      - scratch:/scratch
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamd: { condition: service_healthy, required: false } # previews and tests use the fake scanner

  # ClamAV's daemon; the extract worker streams each upload to it (INSTREAM). The signature
  # database updates itself (freshclam) into its own volume; StreamMaxLength is raised above
  # the 50 MiB upload limit in clamd/clamd.conf. The image is the one the integration tests
  # use (backend/tests/_services.py).
  clamd:
    image: clamav/clamav-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    mem_limit: 3g
    volumes:
      - ./clamd/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamd_db:/var/lib/clamav
    expose: ["3310"]
    restart: unless-stopped

  postgres:
    build: &postgres-build
      context: ./postgres
      # pgbackrest.conf, the crontab and the backup scripts are baked in (P0-28).
      additional_contexts:
        pgbackrest: ./pgbackrest
    image: tumnis-postgres:18
    # conf.d/archive.conf turns archiving on; TUMNIS_BACKUPS=off (a standalone install
    # before its off-site repository exists) turns it off here, as previews do (issue #21).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - archive_mode=${TUMNIS_BACKUPS:-on}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      # archive_command pushes WAL to both pgBackRest repositories (P0-28).
      - pgsocket:/var/run/postgresql
      - pgbackrest_repo1:/var/lib/pgbackrest
      - pgbackrest_spool:/var/spool/pgbackrest
      - /etc/pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
      - db_tls_postgres:/etc/tumnis/tls:ro # server certificate and key (P0-16)
    shm_size: 256mb
    healthcheck:
      # Over TCP: the init-time server listens on the socket only, so this passes only
      # once the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      db-tls: { condition: service_completed_successfully }
    restart: unless-stopped

  # pgBackRest beside the database (P0-28): stanza setup and a first full backup per
  # repository, then the schedules in deploy/pgbackrest/crontab under supercronic. Shares
  # PGDATA, the socket and repo1 with postgres; runs as the postgres user.
  backup:
    build: *postgres-build
    image: tumnis-postgres:18
    user: postgres
    # With TUMNIS_BACKUPS=off it idles (stanza-create would fail without the repository
    # keys and restart forever) until the backups are set up. Every spelling Postgres reads
    # as archive_mode off (any case: off, false, no, 0) idles here too.
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$(printf '%s' '${TUMNIS_BACKUPS:-on}' | tr '[:upper:]' '[:lower:]')" in
          off | false | no | 0)
            echo "backup: off (TUMNIS_BACKUPS=${TUMNIS_BACKUPS:-on}); see docs/OPERATIONS.md, Backups"
            trap 'exit 0' TERM INT
            while :; do sleep 3600 & wait $$!; done
            ;;
        esac
        init-stanza.sh && exec supercronic /etc/pgbackrest/crontab
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
      - pgbackrest_repo1:/var/lib/pgbackrest
      - /etc/pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        mkdir -p /tmp/pgbouncer
        printf '"tumnis_app" "%s"\n' "$$APP_DB_PASSWORD" > /tmp/pgbouncer/userlist.txt
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - db_tls_pgbouncer:/etc/tumnis/tls:ro # its certificate, key and the CA (P0-16)
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # HTTPS for an install without Coolify (README, Install), only with the `standalone`
  # profile: Coolify, previews and the test stacks never start it. Caddy terminates TLS
  # with the certificate the README puts in /etc/tumnis/https (Tailscale's, or a
  # self-signed one) and proxies to the api. It listens on TUMNIS_BIND_ADDRESS only:
  # loopback by default, the machine's Tailscale address for the phone, never every
  # interface (FR-9.1).
  proxy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [standalone]
    environment:
      TUMNIS_HOST: ${TUMNIS_HOST:-localhost}
    ports:
      - "${TUMNIS_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/tumnis/https:/etc/tumnis/https:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # The database CA and the Postgres and PgBouncer certificates, issued once on first start
  # (P0-16, SEC-9; deploy/postgres/tumnis-db-tls.sh). The CA key is never stored; to
  # rotate, remove the db_tls_* volumes and start the stack again.
  db-tls:
    build: *postgres-build
    image: tumnis-postgres:18
    user: root
    entrypoint: ["tumnis-db-tls.sh"]
    volumes:
      - db_tls_ca:/tls/ca
      - db_tls_postgres:/tls/postgres
      - db_tls_pgbouncer:/tls/pgbouncer
    restart: "no"

volumes:
  pgdata: {}
  spool: {} # uploads between the api and worker-extract (P1-16)
  scratch: {} # worker-extract's working space
  # The worker's Git vault clones (P3-12): a cache, cloned again from the remote when lost.
  # The deploy keys live sealed in Postgres; a running command's key file is on the worker's
  # .keys tmpfs, never in this volume.
  obsidian: {}
  clamd_db: {}
  pgsocket: {}
  # Repository 1 (local). On the homelab, point it at a second disk (driver_opts bind).
  pgbackrest_repo1: {}
  pgbackrest_spool: {}
  db_tls_ca: {}
  db_tls_postgres: {}
  db_tls_pgbouncer: {}
  caddy_data: {} # the proxy's own state (no certificates are issued: they come from the host)
