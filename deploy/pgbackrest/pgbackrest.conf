# pgBackRest for Tumnis (P0-28, REL-1, SEC-9, ADR-0006): https://pgbackrest.org/configuration.html
# Baked into the tumnis-postgres image at /etc/pgbackrest/pgbackrest.conf. No secrets here:
# repo2-s3-key, repo2-s3-key-secret and repo2-cipher-pass live in
# /etc/pgbackrest/conf.d/secrets.conf, mounted read-only from the host (pgBackRest reads
# conf.d through its default config-include-path). An option may be set only once across
# all files; override a value here with PGBACKREST_<OPTION> environment variables instead
# (the rehearsal stack points repo2 at MinIO that way, deploy/pgbackrest/rehearsal.env).
# pgBackRest reads comments only on their own lines, never after a value.

[global]
# Repository 1: local, on its own volume (bind it to a second disk on the homelab).
repo1-path=/var/lib/pgbackrest
# (plan default) four weekly fulls, about 28 days
repo1-retention-full=4
repo1-bundle=y

# Repository 2: Backblaze B2 over its S3 API, encrypted client side. Endpoint and region
# follow the bucket's account region; change both together.
repo2-type=s3
repo2-path=/tumnis/pgbackrest
repo2-s3-endpoint=s3.us-west-004.backblazeb2.com
repo2-s3-region=us-west-004
repo2-s3-bucket=tumnis-backups
repo2-s3-uri-style=host
repo2-cipher-type=aes-256-cbc
# No repo2-retention-*: pgBackRest never expires repo2, so the B2 key needs no delete
# capability. A B2 lifecycle rule removes files older than 35 days (architecture, Backup
# and recovery).

compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
# Logs go to stderr (the Postgres log for archive-push, docker logs for backups); a log
# file would grow unrotated inside the container.
log-level-file=off

[tumnis]
# Postgres 18 images keep PGDATA in /var/lib/postgresql/18/docker (the volume is mounted
# at /var/lib/postgresql).
pg1-path=/var/lib/postgresql/18/docker
