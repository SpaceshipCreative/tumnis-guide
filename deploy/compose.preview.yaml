# PR previews (REL-7), layered on compose.yaml: the seed set on fakes, in a fresh database.
# The compose project is per PR, so the pgdata volume is the preview's own and never the
# production volume; the production secrets directory is not mounted.
x-preview: &preview
  DEPLOYMENT_ENV: preview
  TUMNIS_ADAPTERS: fake

x-secrets: &secrets
  volumes:
    - preview_secrets:/run/secrets:ro
  depends_on:
    secrets: { condition: service_completed_successfully }

services:
  # A preview never archives or backs up: its WAL must never reach the production stanza,
  # and it gets no pgBackRest secrets (P0-28).
  postgres:
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "archive_mode=off"]
    volumes:
      - preview_pgbackrest:/etc/pgbackrest/conf.d:ro
  backup:
    entrypoint: ["true"]
    restart: "no"
    volumes:
      - preview_pgbackrest:/etc/pgbackrest/conf.d:ro
  # A preview's own throwaway master key and pepper (P0-13: the seed user's TOTP secret is
  # sealed, sessions are HMACs under the pepper), made once in its secrets volume. Never
  # production's: that directory is not mounted here.
  secrets:
    image: ghcr.io/spaceshipcreative/tumnis:${TUMNIS_VERSION:-latest}
    user: "0"
    entrypoint: ["python", "-c"]
    command:
      - |
        import base64, json, os
        for name in ("tumnis_master_key", "tumnis_pepper"):
            path = "/run/secrets/" + name
            if not os.path.exists(path):
                key = base64.b64encode(os.urandom(32)).decode()
                with open(path, "w") as out:
                    json.dump({"active": 1, "keys": {"1": key}}, out)
            os.chown(path, 10001, 10001)
            os.chmod(path, 0o600)
    volumes:
      - preview_secrets:/run/secrets
    restart: "no"
  migrate:
    <<: *secrets
    environment: *preview
  api:
    <<: *secrets
    environment:
      <<: *preview
      METRICS_TOKEN_FILE: "" # no token in previews: /metrics answers 401
      # POST /v1/test/reset truncates as the owner role (fakes only).
      DATABASE_OWNER_URL: postgresql+psycopg://tumnis_owner:${OWNER_DB_PASSWORD}@postgres:5432/tumnis?sslmode=require
  worker:
    <<: *secrets
    environment: *preview
  seed:
    image: ghcr.io/spaceshipcreative/tumnis:${TUMNIS_VERSION:-latest}
    command: ["tumnis", "seed"]
    environment:
      <<: *preview
      DATABASE_URL: postgresql+psycopg://tumnis_app:${APP_DB_PASSWORD}@postgres:5432/tumnis?sslmode=require
      DATABASE_DIRECT_URL: postgresql+psycopg://tumnis_app:${APP_DB_PASSWORD}@postgres:5432/tumnis?sslmode=require
    volumes:
      - preview_secrets:/run/secrets:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  preview_secrets: {}
  preview_pgbackrest: {}
