; PgBouncer in front of Postgres for the api (ADR-0006). The worker and DBOS connect
; directly. The compose entrypoint writes the userlist from APP_DB_PASSWORD at start.
[databases]
tumnis = host=postgres port=5432 dbname=tumnis

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
; Transaction pooling; psycopg prepares statements after 5 executions, so PgBouncer
; (1.21 or later) tracks them. P0-06 proves pooled queries across transactions.
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 20
max_client_conn = 200
; TLS on both hops (P0-16, SEC-9). Clients (the api) must use TLS and verify this
; certificate, issued for the name `pgbouncer` by the deployment's database CA (db-tls);
; PgBouncer verifies Postgres's certificate against the same CA.
client_tls_sslmode = require
client_tls_cert_file = /etc/tumnis/tls/pgbouncer.crt
client_tls_key_file = /etc/tumnis/tls/pgbouncer.key
client_tls_protocols = secure
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/tumnis/tls/ca.crt
server_tls_protocols = secure
ignore_startup_parameters = extra_float_digits
