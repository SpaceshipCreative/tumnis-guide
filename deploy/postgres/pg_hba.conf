# a connection without encryption is rejected before authentication, whoever it claims to
# be. The superuser is reachable by local peer only.
# TYPE     DATABASE  USER                     ADDRESS  METHOD
local      all       postgres                          peer
local      all       all                               scram-sha-256
hostssl    all       tumnis_owner,tumnis_app  all      scram-sha-256
hostnossl  all       all                      all      reject
