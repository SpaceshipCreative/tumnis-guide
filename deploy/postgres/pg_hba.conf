# Only the app and owner roles log in over the network, and only over TLS (P0-16 adds an
# explicit hostnossl reject and its test). The superuser is reachable by local peer only.
# TYPE   DATABASE  USER                     ADDRESS  METHOD
local    all       postgres                          peer
local    all       all                               scram-sha-256
hostssl  all       tumnis_owner,tumnis_app  all      scram-sha-256
host     all       all                      all      reject
