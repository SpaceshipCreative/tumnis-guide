# WAL archiving through pgBackRest (P0-28, REL-1, ADR-0006), included from postgresql.conf.
# archive_timeout forces a segment switch at least once a minute, so a quiet database still
# ships WAL well inside the 15-minute RPO; zstd shrinks the mostly empty forced segments.
# A restored copy must start with archive_mode=off (the drill passes -c archive_mode=off),
# or it would push a new timeline into the production stanza.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=tumnis archive-push %p'
archive_timeout = 60s
max_wal_senders = 3
