# Postgres 18 for Tumnis (ADR-0006). Loaded with -c config_file=...; data stays in PGDATA.
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# TLS only (P0-16, SEC-9): pg_hba.conf rejects every connection without it. The certificate
# is issued for the name `postgres` by the deployment's database CA (the db-tls service,
# tumnis-db-tls.sh) and mounted read-only; clients verify it (sslmode=verify-full).
ssl = on
ssl_cert_file = '/etc/tumnis/tls/postgres.crt'
ssl_key_file = '/etc/tumnis/tls/postgres.key'
ssl_min_protocol_version = 'TLSv1.2'

# WAL archiving (wal_level, archive_mode, archive_command, archive_timeout) lives in
# conf.d/archive.conf (P0-28). Included last, so conf.d wins over anything above.
include_dir = 'conf.d'
