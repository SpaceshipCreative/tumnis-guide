# Postgres 18 for Tumnis (ADR-0006). Loaded with -c config_file=...; data stays in PGDATA.
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# TLS on (P0-16 adds ssl_min_protocol_version and a CA-issued certificate).
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'

# WAL archiving (wal_level, archive_mode, archive_command, archive_timeout) lives in
# conf.d/archive.conf (P0-28). Included last, so conf.d wins over anything above.
include_dir = 'conf.d'
