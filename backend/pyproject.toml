[project]
name = "tumnis"
version = "0.1.0"
description = "Tumnis Guide backend: modular monolith (ADR-0001)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "cryptography==50.0.1",
  "dbos==3.1.0",
  "fastapi==0.141.1",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyyaml==6.0.3",
  "sqlalchemy[asyncio]==2.1.1",
  "typer==0.27.2",
  "tzdata==2026.4",
  "uvicorn==0.54.0",
]

[project.scripts]
tumnis = "tumnis.cli:app"

[dependency-groups]
dev = [
  "aioboto3==15.5.0",
  "asyncssh==2.24.0",
  "httpx==0.28.1",
  "hypothesis==6.168.3",
  "import-linter==2.15",
  "mypy==2.3.1",
  "polyfactory==3.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-randomly==5.0.0",
  "pytest-socket==0.8.1",
  "pytest-xdist==3.8.0",
  "ruff==0.16.9",
  "squawk-cli==2.66.0",
  "testcontainers[minio,postgres]==4.15.0",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tumnis"
module-root = ""

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests", "tumnis"]
addopts = "--strict-markers --strict-config -p randomly --disable-socket --allow-unix-socket -ra"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:testcontainers.*",
  # SocketBlockedError warns as it is raised; the error itself is what tests see.
  "ignore:A test tried to use socket:UserWarning:pytest_socket",
]
markers = [
  "req(*ids): PRD requirement IDs this test proves",
  "wp(id): work package that introduced the test",
  "integration: needs Postgres or containers (sockets allowed)",
  "contract: adapter, connector or schema contract",
  "slow: over 5 seconds",
  "drill: restore drill only, never on PRs",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tumnis", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "DTZ", "TID", "PT", "N", "C4", "RET", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["tumnis", "tests", "fixtures"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "rules.py takes `now` as an argument (AGENTS.md, Time)."
"datetime.datetime.utcnow".msg = "rules.py takes `now` as an argument."
"datetime.datetime.today".msg = "rules.py takes `now` as an argument."
"datetime.date.today".msg = "rules.py takes `today` as an argument."
"time.time".msg = "rules.py takes `now` as an argument."
"time.monotonic".msg = "rules.py takes `now` as an argument."
"random".msg = "rules.py is deterministic; pass the value in."
"uuid.uuid4".msg = "rules.py is deterministic; pass the id in."
"os".msg = "rules.py reads no environment and no files."
"subprocess".msg = "rules.py does no I/O."
"socket".msg = "rules.py does no I/O."

[tool.ruff.lint.per-file-ignores]
# The banned-api list applies only to rules files: ignore TID251 everywhere else.
"!tumnis/modules/*/rules*.py" = ["TID251"]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"tumnis/modules/*/tests/**" = ["S101", "PLR2004", "S105", "S106"]
"tumnis/core/tests/**" = ["S101", "PLR2004", "S105", "S106"]
"tumnis/modules/*/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tumnis/modules/.*/migrations/"]

# mypy patterns take `*` only as a whole component, so the plan's "tumnis.modules.*.rules_*"
# is rejected; a later rules_<x>.py gets its own entry here.
[[tool.mypy.overrides]]
module = ["tumnis.core.*", "tumnis.modules.*.rules", "tumnis.modules.*.api"]
strict = true

[tool.coverage.run]
source = ["tumnis"]
branch = true
omit = ["tumnis/modules/*/migrations/*", "tumnis/modules/*/tests/*", "tumnis/core/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
