# Alembic runs as the owner role (DATABASE_OWNER_URL). One branch per folder, so upgrades
# target "heads": core's own revisions from P0-04; P0-06 adds every module's migrations/
# folder to version_locations (separated by the OS path separator, ":" on Linux and macOS).
[alembic]
script_location = %(here)s/tumnis/core/alembic
path_separator = os
version_locations = %(here)s/tumnis/core/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
