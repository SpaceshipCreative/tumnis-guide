# Alembic runs as the owner role (DATABASE_OWNER_URL). Bare setup from P0-02: no
# revisions yet. P0-06 lists every module's migrations/ folder in version_locations
# (one branch per module, so upgrades target "heads").
[alembic]
script_location = %(here)s/tumnis/core/alembic
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
