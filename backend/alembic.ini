# Alembic runs as the owner role (DATABASE_OWNER_URL). One branch per module (P0-06): core
# and every module keep their revisions in their own migrations/ folder, each module's
# first revision carries `branch_labels = ("<module>",)` and depends on the core baseline,
# so upgrades target "heads". New revision: alembic revision -m "..." --head <module>@head.
# One location per line: path_separator = newline (Alembic 1.16 and later; `space` would
# need all sixteen on one line, since the ini continuation lines join with newlines).
[alembic]
script_location = %(here)s/tumnis/core/alembic
path_separator = newline
version_locations =
    %(here)s/tumnis/core/migrations
    %(here)s/tumnis/modules/auth/migrations
    %(here)s/tumnis/modules/projects/migrations
    %(here)s/tumnis/modules/tasks/migrations
    %(here)s/tumnis/modules/planning/migrations
    %(here)s/tumnis/modules/agents/migrations
    %(here)s/tumnis/modules/focus/migrations
    %(here)s/tumnis/modules/decisions/migrations
    %(here)s/tumnis/modules/search/migrations
    %(here)s/tumnis/modules/knowledge/migrations
    %(here)s/tumnis/modules/integrations/migrations
    %(here)s/tumnis/modules/calendar/migrations
    %(here)s/tumnis/modules/github/migrations
    %(here)s/tumnis/modules/coolify/migrations
    %(here)s/tumnis/modules/notifications/migrations
    %(here)s/tumnis/modules/usage/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
