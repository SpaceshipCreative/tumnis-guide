# Fixture event stream (P1-18, T-P1-18-03): events as the metric functions read them,
# and the metrics they must give. Format (usage/tests/streams.py loads it):
#   timezone, range {from, to} (local days, both inclusive), optional weekdays (0 = Monday;
#   default Monday to Friday) and events, each with `at` (UTC) and `type`:
#   app_open; plan.published {day, task_ids}; human.decided {item_kind, decision} (counts
#   on the local day of `at`); task.status_changed {task, to, from?, actor?, label?,
#   estimate?, actual?}: `to: done` is a completion, `from: today, to: backlog, actor:
#   system` is a night's rollover.
#
# One working week with no plans and no estimates: opens on 2 of 5 days, 3
# completions over 5 working days; nothing planned and nothing estimated.
timezone: America/New_York
range: {from: 2026-03-09, to: 2026-03-13}
expect:
  daily_open_rate: 0.4
  tasks_completed_per_working_day: 0.6
  rollover_rate: null
  estimate_error: null
  consecutive_plan_days: 0
events:
  - {at: "2026-03-09T13:00:00Z", type: app_open}
  - {at: "2026-03-10T13:00:00Z", type: app_open}
  - {at: "2026-03-09T20:00:00Z", type: task.status_changed, task: a1, to: done, label: ai}
  - {at: "2026-03-10T20:00:00Z", type: task.status_changed, task: a2, to: done, label: ai}
  - {at: "2026-03-12T20:00:00Z", type: task.status_changed, task: h1, to: done, label: human}
