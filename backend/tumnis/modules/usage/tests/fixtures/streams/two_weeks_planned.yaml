range: {from: 2026-03-09, to: 2026-03-20}
expect:
  daily_open_rate: 1.0
  tasks_completed_per_working_day: 2.0
  rollover_rate: 0.1
  estimate_error: 0.25
  consecutive_plan_days: 10
