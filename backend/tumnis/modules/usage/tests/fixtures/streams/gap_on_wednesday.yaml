range: {from: 2026-03-09, to: 2026-03-20}
expect:
  daily_open_rate: 0.8333333333333334
  tasks_completed_per_working_day: 1.2
  rollover_rate: 0.2
  estimate_error: 0.5
  consecutive_plan_days: 2
