# Fixture event stream (P1-18, T-P1-18-03): events as the metric functions read them,
# and the metrics they must give. Format (usage/tests/streams.py loads it):
#   timezone, range {from, to} (local days, both inclusive), optional weekdays (0 = Monday;
#   default Monday to Friday) and events, each with `at` (UTC) and `type`:
#   app_open; plan.published {day, task_ids}; human.decided {item_kind, decision} (counts
#   on the local day of `at`); task.status_changed {task, to, from?, actor?, label?,
#   estimate?, actual?}: `to: done` is a completion, `from: today, to: backlog, actor:
#   system` is a night's rollover.
#
# A plan every weekday but no decision on Wednesday 18 March, so the run ending
# Friday 20 March is Thursday and Friday; opens on weekdays only (10 of 12 days);
# 9 weekday + 1 AI + 1 Saturday + 1 late-Friday completions over 10 working days.
