# DST vectors for P0-19 (FR-3.5, FR-3.6, REL-6), verified with zoneinfo on 2026-09-28 (plan)
# and 2026-09-29. Loaded by T-P0-19-01 to 06 and 11, so a reviewer reads one file.
#
# recurrence: `next_occurrence(spec, after, tz)`; `expected` lists the next instants in
# order (each one the `after` of the next). Times are UTC; `local` is the wall time the
# first result reads in the zone. Every case is tagged with the tests that load it.
# day_close: `next_day_close(anchor, tz)`, the first local midnight after the anchor.

recurrence:
  - {case: "US spring 2026, daily", tags: [daily], zone: America/New_York, preset: daily,
     after: "2026-03-07T14:00Z", expected: ["2026-03-08T13:00Z"], local: "2026-03-08 09:00 EDT"}
  - {case: "US fall 2026, daily", tags: [daily], zone: America/New_York, preset: daily,
     after: "2026-10-31T13:00Z", expected: ["2026-11-01T14:00Z"], local: "2026-11-01 09:00 EST"}
  - {case: "US spring 2027, daily", tags: [daily], zone: America/New_York, preset: daily,
     after: "2027-03-13T14:00Z", expected: ["2027-03-14T13:00Z"], local: "2027-03-14 09:00 EDT"}
  - {case: "US fall 2027, daily", tags: [daily], zone: America/New_York, preset: daily,
     after: "2027-11-06T13:00Z", expected: ["2027-11-07T14:00Z"], local: "2027-11-07 09:00 EST"}
  - {case: "AU DST ends 2026, daily", tags: [daily], zone: Australia/Sydney, preset: daily,
     after: "2026-04-03T22:00Z", expected: ["2026-04-04T23:00Z"], local: "2026-04-05 09:00 AEST"}
  - {case: "AU DST starts 2026, daily", tags: [daily], zone: Australia/Sydney, preset: daily,
     after: "2026-10-02T23:00Z", expected: ["2026-10-03T22:00Z"], local: "2026-10-04 09:00 AEDT"}
  - {case: "AU DST ends 2027, daily", tags: [daily], zone: Australia/Sydney, preset: daily,
     after: "2027-04-02T22:00Z", expected: ["2027-04-03T23:00Z"], local: "2027-04-04 09:00 AEST"}
  - {case: "AU DST starts 2027, daily", tags: [daily], zone: Australia/Sydney, preset: daily,
     after: "2027-10-01T23:00Z", expected: ["2027-10-02T22:00Z"], local: "2027-10-03 09:00 AEDT"}
  - {case: "Weekdays, Fri to Mon", tags: [weekdays], zone: America/New_York, preset: weekdays,
     after: "2026-03-06T14:00Z", expected: ["2026-03-09T13:00Z"], local: "2026-03-09 09:00 EDT"}
  - {case: "Weekly Sun 02:30, gap", tags: [gap], zone: America/New_York, preset: weekly,
     weekday: 6, due_time: "02:30", after: "2026-03-01T12:00Z",
     expected: ["2026-03-08T07:30Z"], local: "2026-03-08 03:30 EDT"}
  - {case: "Weekly Sun 02:30, gap", tags: [gap], zone: Australia/Sydney, preset: weekly,
     weekday: 6, due_time: "02:30", after: "2026-09-27T00:00Z",
     expected: ["2026-10-03T16:30Z"], local: "2026-10-04 03:30 AEDT"}
  - {case: "Weekly Sun 01:30, overlap", tags: [overlap], zone: America/New_York, preset: weekly,
     weekday: 6, due_time: "01:30", after: "2026-10-26T12:00Z",
     expected: ["2026-11-01T05:30Z", "2026-11-08T06:30Z"], local: "2026-11-01 01:30 EDT"}
  - {case: "Weekly Sun 02:30, overlap", tags: [overlap], zone: Australia/Sydney, preset: weekly,
     weekday: 6, due_time: "02:30", after: "2027-04-01T00:00Z",
     expected: ["2027-04-03T15:30Z"], local: "2027-04-04 02:30 AEDT"}
  - {case: "Monthly on 31", tags: [monthly], zone: America/New_York, preset: monthly,
     month_day: 31, after: "2027-01-31T15:00Z",
     expected: ["2027-02-28T14:00Z", "2027-03-31T13:00Z", "2027-04-30T13:00Z"],
     local: "2027-02-28 09:00 EST"}
  - {case: "Monthly on 31, leap year", tags: [monthly], zone: America/New_York, preset: monthly,
     month_day: 31, after: "2028-01-31T15:00Z", expected: ["2028-02-29T14:00Z"],
     local: "2028-02-29 09:00 EST"}
  - {case: "Cron 30 2 * * *", tags: [cron], zone: America/New_York, cron: "30 2 * * *",
     after: "2026-03-08T06:00Z", expected: ["2026-03-08T07:30Z", "2026-03-09T06:30Z"],
     local: "2026-03-08 03:30 EDT"}

