id: s3_etag_change
proves: An outside overwrite on S3 is detected by its ETag
backends: [s3]
steps:
  - outside_write: {path: "uploads/a.txt", content: "version one"}
  - sync
  - outside_write: {path: "uploads/a.txt", content: "version two"}
  - sync
  - expect:
      document: {path: "uploads/a.txt", versions: 2, body: "version two"}
      extraction_requested: ["uploads/a.txt", "uploads/a.txt"]
