# Local hooks run the uv-locked tool versions, so pre-commit and CI never disagree.
# Install: `uv tool install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # gitleaks git --pre-commit --staged (successor of `gitleaks protect --staged`)

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: bash -c 'cd backend && uv run ruff check --fix'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy tumnis
        entry: bash -c 'cd backend && uv run mypy tumnis'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        files: ^backend/(.*\.py|\.importlinter)$
        pass_filenames: false
      - id: frontend-lint
        name: npm run lint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
