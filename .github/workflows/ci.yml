# CI: the architecture's nine jobs plus spec-guard, red-proof and traceability (P0-03, P1-04).
#
# Job ids are the required-check names: .github/required-checks.txt lists them and
# scripts/ci/branch_protection.sh requires them on main. Every job runs on every PR (no
# `paths:` filters: a required check that never reports blocks a merge forever); jobs
# that do not apply exit green instead. A test (T-P0-03-16) keeps this file,
# required-checks.txt and the per-job budgets in step.
#
# Actions are pinned by commit SHA; Renovate bumps the SHA and the version comment.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # traceability comment
  issues: read # spec-guard reads who added the spec-change label

env:
  UV_FROZEN: "1"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the profile VERSION check diffs against the base commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend lint, types and boundaries
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy tumnis
          uv run lint-imports
      - name: CI scripts lint and types
        working-directory: backend
        run: |
          uv run ruff check --config pyproject.toml ../scripts/ci ../scripts/release
          uv run ruff format --config pyproject.toml --check ../scripts/ci ../scripts/release
          uv run mypy --strict ../scripts/ci ../scripts/release
      - name: Profile VERSION bumps (P1-05)
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            "" | 0000000000000000000000000000000000000000) echo "no base commit; skipped" ;;
            *) uv run python ../scripts/ci/profile_version_check.py --base "$BASE_SHA" --head "$GITHUB_SHA" ;;
          esac
      - name: Frontend lint and types
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Before pytest: the spec-guard tests parse TypeScript with frontend/node_modules.
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # mypy's incremental cache for the toolchain test (T-P0-01): about 36 s cold, about 1 s
      # warm. mypy checks each cached module's hash, so a stale entry is only rechecked. A
      # key that changes every run, plus restore-keys, restores the newest cache and saves
      # an updated one (actions/cache tips-and-workarounds, "Update a cache").
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-
            mypy-${{ runner.os }}-
      # worksteal lets idle workers take queued tests from busy ones, which shortens the
      # slow tail (the contract job already uses it); --durations shows the slowest tests.
      - name: Backend unit tests with coverage
        working-directory: backend
        run: |
          uv sync
          uv run pytest -m "not integration and not contract" -n auto --dist worksteal --durations=15 --cov --cov-report=json
      - name: Coverage gates
        run: uv run --project backend python scripts/ci/coverage_gates.py backend/coverage.json
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # squawk diffs the revisions against the base commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # openapi-ts and the pinned Prettier, for T-P0-11-04 and `make gen`.
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Schemas, generation, versions and the Schemathesis fuzzer (P0-11; it needs Docker
      # for Postgres, and runs here only: the integration job skips contract tests).
      # Spread over the runner's cores, like the unit and integration jobs: the fuzzer
      # alone takes about 40 s, and run one after another the layer no longer fits the
      # 2-minute budget once the storage suites (a MinIO container, 1050-file listings)
      # joined it. worksteal lets the idle worker take the rest while one runs the fuzzer.
      - name: Contract tests
        working-directory: backend
        run: |
          uv sync
          uv run pytest -m contract -n auto --dist worksteal --durations=10
      - name: squawk on changed expand revisions (P0-06)
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python ../scripts/ci/squawk_migrations.py --changed-since "$BASE_SHA"
      # A model, route or fixture changed without `make gen` (or a hand edit to a generated
      # file) fails here; intent-to-add makes a new generated file show in the diff too.
      - name: Generated code is committed
        run: |
          make gen
          git add --intent-to-add -- schemas frontend/src/api backend/tests/contract/generated
          git diff --exit-code -- schemas frontend/src/api backend/tests/contract/generated

  # The runner daemon is its own uv project and never imports backend/ (P1-04); its
  # contract test checks its protocol copies against schemas/runner/v1.
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: daemon/uv.lock
      - name: Daemon lint, types and tests
        working-directory: daemon
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Integration tests (Postgres 18, DBOS, MinIO, SFTP, clamd)
        working-directory: backend
        run: |
          uv sync
          # Pull the service images while xdist starts, so no worker's first test waits on one.
          uv run python -c "from tests._services import CLAMD_IMAGE, MINIO_IMAGE, SFTP_IMAGE; from tests.fixtures import PG_IMAGE, PGBOUNCER_IMAGE; print(PG_IMAGE, PGBOUNCER_IMAGE, MINIO_IMAGE, SFTP_IMAGE, CLAMD_IMAGE)" | xargs -n1 -P5 docker pull -q > /dev/null &
          uv run pytest -m "integration and not contract" -n auto --dist worksteal --durations=40

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the test stack (compose.test with fakes)
        run: |
          if [ -f deploy/compose.test.yaml ]; then
            docker compose -f deploy/compose.test.yaml up -d --wait
            echo "E2E_BASE_URL=http://localhost:8080" >> "$GITHUB_ENV"
          else
            echo "deploy/compose.test.yaml arrives with P0-04; running the harness specs only"
          fi
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # The timings (A0.6, P0-29) run in the performance job only (hardware-sensitive).
          npx playwright test --grep-invert "@A0\.6|@P0-29"
      - name: Stack logs on failure
        if: failure() && hashFiles('deploy/compose.test.yaml') != ''
        run: |
          docker compose -f deploy/compose.test.yaml logs --no-color --tail=200
          # The tail above often starts after the failing request; the errors of the whole
          # run, from the api and Postgres, say why it failed.
          echo "::group::api and postgres errors over the whole run"
          docker compose -f deploy/compose.test.yaml logs --no-color api postgres \
            | grep -E 'ERROR|FATAL|Traceback|deadlock|" 5[0-9][0-9]' | grep -v 'violates foreign key' | tail -n 300 || true
          echo "::endgroup::"
          # The whole run's logs per service, for the artifact below (issue #56).
          mkdir -p stack-logs
          for service in api worker postgres; do
            docker compose -f deploy/compose.test.yaml logs --no-color --timestamps "$service" \
              > "stack-logs/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && hashFiles('deploy/compose.test.yaml') != ''
        with:
          name: e2e-logs
          path: |
            stack-logs/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Skills and Performance need the homelab self-hosted runner (P1-05, P0-29). Until the
  # repo variable HOMELAB_RUNNER is "true" they run as stubs on a GitHub-hosted runner, so
  # a missing or offline homelab runner can never leave a required check queued.
  # Skills (P1-05): the only job that calls a model. The harness's own tests run on any
  # runner. The skill cases (3 runs each through the real Hermes and the pinned model) run
  # only on the homelab runner, which never takes a fork's PR, and only when profiles/, the
  # skill schemas or the daemon's run path changed; otherwise the job exits green.
  skills:
    runs-on: ${{ vars.HOMELAB_RUNNER == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted", "homelab", "hermes"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the change check diffs against the base commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: profiles/uv.lock
      - name: Harness lint, types and tests; every case loads
        working-directory: profiles
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q
          uv run python -m harness check --cases tests/cases
      - name: Did a skill input change?
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=true
          case "$BASE_SHA" in
            "" | 0000000000000000000000000000000000000000) ;;
            *) git diff --quiet "$BASE_SHA...$GITHUB_SHA" -- profiles schemas/enrichment \
                 schemas/planning daemon && changed=false ;;
          esac
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "skill inputs changed: $changed"
      - name: Skill cases, 3 runs each (homelab Hermes)
        if: runner.environment == 'self-hosted' && steps.changed.outputs.changed == 'true'
        working-directory: profiles
        run: uv run python -m harness run --cases tests/cases --junit "$RUNNER_TEMP/skills-junit.xml"

  # Security (P0-16, SEC-7): every tool exits non-zero on a high or critical finding, and
  # the job is required, so such a finding blocks the merge. A finding with no fix yet goes
  # in .trivyignore with an issue link and an expiry at most 30 days out (T-P0-16-17).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the commits this change adds
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Python dependencies (pip-audit, strict)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      - name: npm dependencies (npm audit, high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secrets (gitleaks over the commits this change adds)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="$BASE_SHA..$GITHUB_SHA"
          case "$BASE_SHA" in "" | 0000000000000000000000000000000000000000) range="$GITHUB_SHA" ;; esac
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1
      # avoid-sqlalchemy-text flags every text() call; tumnis-sql-fstring is the stricter,
      # exact rule for what it looks for (SQL built with f-strings).
      - name: Code (Semgrep, registry packs and the custom rules)
        run: >-
          uvx --from semgrep==1.178.0 semgrep scan --metrics=off
          --config p/python --config p/typescript --config p/secrets --config .semgrep/tumnis.yml
          --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text
          --error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          tags: tumnis:ci
          load: true
          cache-from: type=gha,scope=tumnis-image
          cache-to: type=gha,scope=tumnis-image,mode=max
      - name: Image (Trivy, high and critical findings that have a fix)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1
          tumnis:ci

  # Performance (P0-29, PERF-1, PERF-2): the budgets on the load set (10 projects, 2,000
  # tasks) of the compose.test stack. The bundle budget on the image's own dist; k6 against
  # perf/baseline.json (a p95 more than 20% AND at least 50 ms worse, or over its NFR,
  # fails; decision 27); Lighthouse CI at 375 px; the Playwright timings (A0.6,
  # T-P0-29-01..03), which the e2e job leaves out.
  # On the homelab runner ([self-hosted, homelab], as preview.yml, and never for a fork's
  # PR) once HOMELAB_RUNNER is "true"; until then GitHub-hosted, so a required check never
  # waits on a runner that doesn't exist yet. The Playwright timings run only on the
  # homelab runner (plan: hardware-sensitive; decision 25); each pays a load-set reset,
  # which a GitHub-hosted run cannot fit in the job's 5 minutes.
  performance:
    runs-on: ${{ vars.HOMELAB_RUNNER == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      K6_IMAGE: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
      LHCI_CLI: "@lhci/cli@0.15.1"
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Every script before the Playwright step uses Node built-ins only, so the frontend
      # install and Chromium are for the homelab timings alone; a GitHub-hosted run skips
      # them and fetches the Lighthouse CI package instead, both while the stack builds.
      - name: Start the test stack; pull k6, Lighthouse CI and (homelab) Chromium meanwhile
        run: |
          install=
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            (cd frontend && npm ci --no-audit --no-fund && npx playwright install chromium) \
              > "$RUNNER_TEMP/install.log" 2>&1 &
            install=$!
          fi
          docker pull -q "$K6_IMAGE" > /dev/null &
          pull=$!
          npx --yes "$LHCI_CLI" --version > "$RUNNER_TEMP/lhci-install.log" 2>&1 &
          lhci=$!
          # --build: a persistent homelab runner keeps the last run's tumnis images.
          docker compose -f deploy/compose.test.yaml up -d --build --wait
          if [ -n "$install" ]; then
            wait "$install" || { cat "$RUNNER_TEMP/install.log"; exit 1; }
          fi
          wait "$pull"
          wait "$lhci" || { cat "$RUNNER_TEMP/lhci-install.log"; exit 1; }
      - name: Bundle budget of the served build (T-P0-29-09) and the threshold builder (T-P0-29-06)
        run: |
          docker cp "$(docker compose -f deploy/compose.test.yaml ps -q api):/app/frontend/dist" "$RUNNER_TEMP/dist"
          node scripts/ci/check_bundle.mjs "$RUNNER_TEMP/dist"
          node --test perf/thresholds.test.mjs scripts/ci/check_bundle.test.mjs
      - name: Load set; an API key for k6 and a session for Lighthouse
        run: |
          curl -fsS -X POST "$E2E_BASE_URL/v1/test/reset?set=load"
          node perf/sign_in.mjs --base "$E2E_BASE_URL" --github-env
      - name: k6 against perf/baseline.json (T-P0-29-04, T-P0-29-05)
        run: |
          mkdir -p "$RUNNER_TEMP/k6"
          status=0
          for script in quickadd dashboard; do
            docker run --rm --network host -u "$(id -u):$(id -g)" \
              -v "$PWD/perf:/perf:ro" -v "$RUNNER_TEMP/k6:/out" \
              -e BASE_URL="$E2E_BASE_URL" -e TUMNIS_KEY -e PROJECT_ID \
              "$K6_IMAGE" run --quiet --summary-export "/out/$script.json" "/perf/k6/$script.js" \
              || status=1
          done
          node perf/check_summary.mjs "$RUNNER_TEMP"/k6/*.json
          exit "$status"
      # Decision 26: the Core Web Vitals budget gates on a LAN/VPN profile (lighthouserc.json:
      # 50 ms RTT, 10 Mbps, 2x CPU for a current phone). Lighthouse's default slow phone
      # (slow 4G, 4x CPU) only warns (lighthouserc.slow-phone.json, one run of the
      # dashboard, which keeps the job inside its 5 minutes); Phase 4 works on those
      # numbers. It runs first because each collect clears .lighthouseci/.
      - name: Lighthouse on the default slow phone, warnings only (decision 26)
        working-directory: frontend
        run: |
          npx --yes "$LHCI_CLI" autorun --config=lighthouserc.slow-phone.json \
            --collect.url="$E2E_BASE_URL/" \
            --collect.settings.extraHeaders="$LHCI_EXTRA_HEADERS"
          mkdir -p "$RUNNER_TEMP/lhci/slow-phone"
          for lhr in .lighthouseci/lhr-*.json; do
            [ -e "$lhr" ] || continue
            jq 'del(.configSettings.extraHeaders)' "$lhr" > "$RUNNER_TEMP/lhci/slow-phone/$(basename "$lhr")"
          done
      - name: Lighthouse CI, Core Web Vitals at 375 px on LAN (T-P0-29-08)
        working-directory: frontend
        run: >-
          npx --yes "$LHCI_CLI" autorun --config=lighthouserc.json
          --collect.url="$E2E_BASE_URL/"
          --collect.url="$E2E_BASE_URL/projects/$PROJECT_ID?view=board"
          --collect.settings.extraHeaders="$LHCI_EXTRA_HEADERS"
      # The LHRs carry the session header in configSettings.extraHeaders; drop it before
      # the upload (upload-artifact leaves hidden directories such as .lighthouseci/ out).
      - name: Lighthouse reports for the artifact, without the session header
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lhci/lan"
          for lhr in frontend/.lighthouseci/lhr-*.json; do
            [ -e "$lhr" ] || continue
            jq 'del(.configSettings.extraHeaders)' "$lhr" > "$RUNNER_TEMP/lhci/lan/$(basename "$lhr")"
          done
      - name: Playwright timings on the load set (A0.6, T-P0-29-01..03), homelab runner only
        if: runner.environment == 'self-hosted'
        working-directory: frontend
        run: |
          npx playwright test --grep "@A0\.6|@P0-29"
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.test.yaml logs --no-color --tail=200 api worker
      # The k6 summaries are what a new perf/baseline.json is drawn from (make perf-baseline).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance
          path: |
            ${{ runner.temp }}/k6/
            ${{ runner.temp }}/lhci/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A job skipped by `if:` counts as passing for branch protection, which is why the two
  # PR-only guards skip only on push to main.
  spec-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript for the test extractor
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts
      # The event's base SHA can predate a main the PR has since merged (#79, #81), so
      # compare with the base branch as it is now; the script uses its merge-base with head.
      - name: Fetch the current base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: spec-guard
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_CHANGE_ACTORS: ${{ vars.SPEC_CHANGE_ACTORS }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/ci/spec_guard.py --base "origin/$BASE_REF" --head "$GITHUB_SHA"
          --labels "$LABELS" --pr "$PR_NUMBER"

  red-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Not a bug PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'bug') }}
        run: echo "no bug label; red-proof applies only to PRs labeled bug"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: red-proof
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          (cd frontend && npm ci --no-audit --no-fund)
          (cd backend && uv sync)
          uv run --project backend python scripts/ci/red_proof.py \
            --base "$BASE_SHA" --head "$GITHUB_SHA" --pr "$PR_NUMBER"

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Traceability matrix and gate
        run: |
          (cd frontend && npm ci --no-audit --no-fund --ignore-scripts)
          (cd backend && uv sync)
          uv run --project backend python scripts/ci/traceability.py \
            --out trace.md --json traceability.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: traceability
          path: |
            trace.md
            traceability.json
          if-no-files-found: ignore
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('trace.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr comment "$PR_NUMBER" --body-file trace.md --edit-last
          || gh pr comment "$PR_NUMBER" --body-file trace.md
