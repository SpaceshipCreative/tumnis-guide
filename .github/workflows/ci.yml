# CI: the architecture's eight jobs plus spec-guard, red-proof and traceability (P0-03).
#
# Job ids are the required-check names: .github/required-checks.txt lists them and
# scripts/ci/branch_protection.sh requires them on main. Every job runs on every PR (no
# `paths:` filters: a required check that never reports blocks a merge forever); jobs
# that do not apply exit green instead. A test (T-P0-03-16) keeps this file,
# required-checks.txt and the per-job budgets in step.
#
# Actions are pinned by commit SHA; Renovate bumps the SHA and the version comment.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # traceability comment
  issues: read # spec-guard reads who added the spec-change label

env:
  UV_FROZEN: "1"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend lint, types and boundaries
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy tumnis
          uv run lint-imports
      - name: CI scripts lint and types
        working-directory: backend
        run: |
          uv run ruff check --config pyproject.toml ../scripts/ci
          uv run ruff format --config pyproject.toml --check ../scripts/ci
          uv run mypy --strict ../scripts/ci
      - name: Frontend lint and types
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Before pytest: the spec-guard tests parse TypeScript with frontend/node_modules.
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Backend unit tests with coverage
        working-directory: backend
        run: |
          uv sync
          uv run pytest -m "not integration and not contract" -n auto --cov --cov-report=json
      - name: Coverage gates
        run: uv run --project backend python scripts/ci/coverage_gates.py backend/coverage.json
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # squawk diffs the revisions against the base commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Contract tests
        working-directory: backend
        run: |
          uv sync
          uv run pytest -m contract
      - name: squawk on changed expand revisions (P0-06)
        working-directory: backend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python ../scripts/ci/squawk_migrations.py --changed-since "$BASE_SHA"
      - name: Generated code is committed
        run: make gen && git diff --exit-code # P0-11 fills `make gen`

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Integration tests (Postgres 18, DBOS, MinIO, SFTP, clamd)
        working-directory: backend
        run: |
          uv sync
          uv run pytest -m integration -n auto

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the test stack (compose.test with fakes)
        run: |
          if [ -f deploy/compose.test.yaml ]; then
            docker compose -f deploy/compose.test.yaml up -d --wait
            echo "E2E_BASE_URL=http://localhost:8080" >> "$GITHUB_ENV"
          else
            echo "deploy/compose.test.yaml arrives with P0-04; running the harness specs only"
          fi
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs on failure
        if: failure() && hashFiles('deploy/compose.test.yaml') != ''
        run: docker compose -f deploy/compose.test.yaml logs --no-color --tail=200

  # Skills and Performance need the homelab self-hosted runner (P1-05, P0-29). Until the
  # repo variable HOMELAB_RUNNER is "true" they run as stubs on a GitHub-hosted runner, so
  # a missing or offline homelab runner can never leave a required check queued.
  skills:
    runs-on: ${{ vars.HOMELAB_RUNNER == 'true' && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - run: echo "Skills job is a stub until P1-05 (profiles harness on the homelab runner)"

  # Security (P0-16, SEC-7): every tool exits non-zero on a high or critical finding, and
  # the job is required, so such a finding blocks the merge. A finding with no fix yet goes
  # in .trivyignore with an issue link and an expiry at most 30 days out (T-P0-16-17).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the commits this change adds
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Python dependencies (pip-audit, strict)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"
      - name: npm dependencies (npm audit, high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secrets (gitleaks over the commits this change adds)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="$BASE_SHA..$GITHUB_SHA"
          case "$BASE_SHA" in "" | 0000000000000000000000000000000000000000) range="$GITHUB_SHA" ;; esac
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1
      # avoid-sqlalchemy-text flags every text() call; tumnis-sql-fstring is the stricter,
      # exact rule for what it looks for (SQL built with f-strings).
      - name: Code (Semgrep, registry packs and the custom rules)
        run: >-
          uvx --from semgrep==1.178.0 semgrep scan --metrics=off
          --config p/python --config p/typescript --config p/secrets --config .semgrep/tumnis.yml
          --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text
          --error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          tags: tumnis:ci
          load: true
          cache-from: type=gha,scope=tumnis-image
          cache-to: type=gha,scope=tumnis-image,mode=max
      - name: Image (Trivy, high and critical findings that have a fix)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1
          tumnis:ci

  performance:
    runs-on: ${{ vars.HOMELAB_RUNNER == 'true' && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - run: echo "Performance job is a stub until P0-29 (k6, Lighthouse CI, bundle budget)"

  # A job skipped by `if:` counts as passing for branch protection, which is why the two
  # PR-only guards skip only on push to main.
  spec-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript for the test extractor
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: spec-guard
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_CHANGE_ACTORS: ${{ vars.SPEC_CHANGE_ACTORS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/ci/spec_guard.py --base "$BASE_SHA" --head "$GITHUB_SHA"
          --labels "$LABELS" --pr "$PR_NUMBER"

  red-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Not a bug PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'bug') }}
        run: echo "no bug label; red-proof applies only to PRs labeled bug"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: red-proof
        if: contains(github.event.pull_request.labels.*.name, 'bug')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          (cd frontend && npm ci --no-audit --no-fund)
          (cd backend && uv sync)
          uv run --project backend python scripts/ci/red_proof.py \
            --base "$BASE_SHA" --head "$GITHUB_SHA" --pr "$PR_NUMBER"

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Traceability matrix and gate
        run: |
          (cd frontend && npm ci --no-audit --no-fund --ignore-scripts)
          (cd backend && uv sync)
          uv run --project backend python scripts/ci/traceability.py \
            --out trace.md --json traceability.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: traceability
          path: |
            trace.md
            traceability.json
          if-no-files-found: ignore
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('trace.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr comment "$PR_NUMBER" --body-file trace.md --edit-last
          || gh pr comment "$PR_NUMBER" --body-file trace.md
