# TEMPORARY (ci-health diagnostics; removed before review).
name: diag
on:
  pull_request:
jobs:
  diag-t01:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: T-01 A/B
        working-directory: backend
        run: |
          uv sync
          uv tool install py-spy
          docker pull -q pgvector/pgvector:pg18
          nproc; uptime
          T=tumnis/modules/decisions/tests/integration/test_label_latency.py
          SEL='-m integration and not contract and serial'
          ARGS="-n 0 --durations=3 -p tests._diag_t01 -s -p no:randomly"
          for i in 1 2; do echo "##### RUN A default $i"; uv run pytest -m "integration and not contract and serial" $ARGS || true; done
          for i in 1 2; do echo "##### RUN B freeze $i"; DIAG_FREEZE=1 uv run pytest -m "integration and not contract and serial" $ARGS || true; done
          for i in 1 2; do echo "##### RUN C path-only $i"; uv run pytest -m "integration and not contract and serial" $ARGS $T || true; done
          echo "##### RUN D py-spy default"
          sudo "$(command -v py-spy)" record -r 200 --threads -f raw -o /tmp/prof.txt -- .venv/bin/python -m pytest -m "integration and not contract and serial" $ARGS || true
          .venv/bin/python tests/_diag_prof.py /tmp/prof.txt
