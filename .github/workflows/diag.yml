# TEMPORARY (ci-health diagnostics; removed before review).
name: diag
on:
  pull_request:
jobs:
  diag-t01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: T-01 x5 quiet
        working-directory: backend
        run: |
          uv sync
          docker pull -q pgvector/pgvector:pg18
          nproc; free -m; uptime
          for i in 1 2 3 4 5; do
            uv run pytest -m "integration and not contract and serial" -n 0 --durations=5 -p tests._diag_t01 -s -p no:randomly || true
          done

