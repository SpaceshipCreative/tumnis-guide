# The README job (P4-06, A4.4, REL-4): the README's tagged commands, run as written on a
# clean VM, must reach a healthy app. Each GitHub-hosted job is a fresh ubuntu-24.04 VM
# with nothing installed beyond the runner image (plan default for "clean VM"); the
# homelab runner is never used here because it is not clean. The checkout stands in for
# the README's clone step (tagged readme:manual). The harness generates the master key,
# the pepper, the passwords and the certificate inside the VM as a reader would: no
# repository secret is used, so a leaked log holds nothing reusable.
#
#   readme-install  on PRs touching the README, .env.example, deploy/ or the harness,
#                   nightly, on release tags and on demand: the install and first-run
#                   suites, with the readiness check between them.
#   readme-upgrade  nightly and on demand: install the previous release by its own
#                   README, then upgrade to this commit and roll back by OPERATIONS.md.
#
# Actions are pinned by commit SHA; Renovate bumps the SHA and the version comment.
name: readme

on:
  pull_request:
    paths:
      - README.md
      - .env.example
      - "deploy/**"
      - scripts/readme_test.py
      - docs/OPERATIONS.md
      - .github/workflows/readme.yml
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "43 5 * * *" # 05:43 UTC, after the nightly workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

env:
  HEALTH_URL: https://localhost/health/ready
  CA_FILE: /etc/tumnis/https/tumnis.crt

jobs:
  readme-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README install and first run (A4.4)
        run: >-
          python3 scripts/readme_test.py --suite install --suite first-run
          --health-url "$HEALTH_URL" --ca-file "$CA_FILE"
          --report "$RUNNER_TEMP/readme-report.json"
      - name: Stack state and logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --timestamps --tail=300 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: readme-install-report
          path: ${{ runner.temp }}/readme-report.json
          if-no-files-found: ignore
          retention-days: 14

  readme-upgrade:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous release tag
          persist-credentials: false
      - name: The previous release with a tested README
        id: previous
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)"
          if [ -z "$tag" ] || ! git cat-file -e "$tag:scripts/readme_test.py" 2>/dev/null; then
            echo "::notice::no release has a tested README yet (${tag:-no tag}): nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install the previous release by its own README
        if: steps.previous.outputs.skip != 'true'
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          git checkout --detach "$PREVIOUS"
          python3 scripts/readme_test.py --suite install \
            --health-url "$HEALTH_URL" --ca-file "$CA_FILE" \
            --report "$RUNNER_TEMP/readme-previous.json"
      - name: Upgrade to this commit, then roll back (OPERATIONS.md, REL-4)
        if: steps.previous.outputs.skip != 'true'
        env:
          TUMNIS_RELEASE: ${{ github.sha }}
          TUMNIS_PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          git checkout --detach "$GITHUB_SHA"
          python3 scripts/readme_test.py --readme docs/OPERATIONS.md --section Upgrade \
            --suite upgrade --health-url "$HEALTH_URL" --ca-file "$CA_FILE" \
            --report "$RUNNER_TEMP/readme-upgrade.json"
      - name: Stack state and logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --timestamps --tail=300 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: readme-upgrade-report
          path: ${{ runner.temp }}/readme-*.json
          if-no-files-found: ignore
          retention-days: 14
