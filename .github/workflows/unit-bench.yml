# TEMPORARY (fix/unit-budget): measures unit-job variants side by side on real runners.
# Removed before the PR is marked ready.
name: unit-bench

on:
  push:
    branches: [fix/unit-budget]

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  NODE_VERSION: "24"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [base, ncc, noiso, vonly, ponly]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Start frontend unit tests
        id: vitest
        if: matrix.variant != 'ponly'
        working-directory: frontend
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          lscpu | grep -m1 "Model name"
          args=""
          if [ "$VARIANT" = ncc ]; then export NODE_COMPILE_CACHE="$RUNNER_TEMP/ncc"; fi
          if [ "$VARIANT" = noiso ]; then args="--no-isolate"; fi
          nohup sh -c "date -u +'Vitest started %T'; npm run test -- --run $args; code=\$?; date -u +'Vitest finished %T'; echo \"\$code\" > \"\$RUNNER_TEMP/vitest.exit.tmp\" && mv \"\$RUNNER_TEMP/vitest.exit.tmp\" \"\$RUNNER_TEMP/vitest.exit\"" > "$RUNNER_TEMP/vitest.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/vitest.pid"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.variant != 'vonly'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.variant != 'vonly'
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-
            mypy-${{ runner.os }}-
      - name: Backend unit tests with coverage
        if: matrix.variant != 'vonly'
        working-directory: backend
        run: |
          lscpu | grep -m1 "Model name"
          uv sync
          uv run pytest -m "not integration and not contract" -n 3 --dist worksteal --durations=15 --cov --cov-report=json
      - name: Frontend unit tests
        if: ${{ !cancelled() && steps.vitest.outcome == 'success' }}
        run: |
          tail -n +1 -f --pid="$(cat "$RUNNER_TEMP/vitest.pid")" "$RUNNER_TEMP/vitest.log" | grep -a -E "Vitest (started|finished)|Test Files|Tests  |Duration|FAIL"
          cat "$RUNNER_TEMP/vitest.exit"
