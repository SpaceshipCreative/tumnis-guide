[project]
name = "tumnis-profiles"
version = "0.1.0"
description = "Tumnis Hermes profiles (master, project template) and the skill test harness."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# The harness imports the daemon's run path (../daemon) and the backend's pure skill
# models and rules (../backend/tumnis/modules/agents/{skill_io,rules}.py) from source:
# harness/__init__.py puts both folders on sys.path, so neither is installed here; their
# runtime dependencies are pinned below, at the same versions.
dependencies = [
  "httpx==0.28.1",  # the daemon's health probes (P2-10), imported with its run path
  "jsonschema==4.26.0",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "types-jsonschema==4.26.0.20260518",
  "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["harness/tests", "tests/cases"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "req(*ids): PRD requirement IDs this test proves",
  "wp(id): work package that introduced the test",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["harness"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "DTZ", "PT", "N", "C4", "RET", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "tumnis", "tumnis_daemon", "jev_mcp"]

[tool.ruff.lint.per-file-ignores]
# Spec tests import the code under test inside their bodies, so a missing module fails
# the test (an expected failure while red), not the collection.
"harness/tests/**" = ["S101", "PLR2004", "PLC0415", "SIM300"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["harness"]
mypy_path = ["../backend", "../daemon"]
# The backend and daemon sources are type-checked by their own projects.
follow_imports = "silent"
