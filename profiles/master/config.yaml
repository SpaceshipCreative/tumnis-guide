# The production model. The skill harness passes the same pair with -m and --provider
# from harness/harness.toml, and harness/tests/test_profile_rules.py keeps the two equal:
# change both together.
model:
  default: UNSET-pinned-homelab-model
  provider: custom

# MCP servers (P2-12). Hermes reads them from here and fills every ${VAR} from the
# profile's own .env (see .env.example); unset variables in a url or header fail the
# server closed. The master works through Tumnis only: it delegates code, deploys and
# infrastructure to project agents.
mcp_servers:
  # Tumnis itself. For a plan or delegation run the daemon sets TUMNIS_TOKEN to the run's
  # workspace-scoped task token; for a cron job (the workspace digest) it is the master's
  # own key from .env.
  tumnis:
    url: ${TUMNIS_URL}/mcp
    headers:
      Authorization: Bearer ${TUMNIS_TOKEN}
  # Jev, the same pinned server as mcp.json (profiles/shared/jev-mcp).
  jev:
    command: uvx
    args:
      - --from
      - git+https://github.com/SpaceshipCreative/tumnis-guide@jev-mcp-v0.1.0#subdirectory=profiles/shared/jev-mcp
      - tumnis-jev-mcp
    env:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
