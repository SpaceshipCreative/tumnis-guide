# Hermes profile distribution (https://hermes-agent.nousresearch.com/docs/user-guide/profile-distributions).
# The master agent: one per workspace. `version` must equal VERSION, and any change under
# this directory needs a VERSION bump (scripts/ci/profile_version_check.py).
# The repo never holds the profile's .env, memories or sessions; .env.example lists the
# variables config.yaml's MCP servers read.
name: tumnis-master
version: 1.1.0
description: Tumnis master agent (plan, orchestrate-master and workspace-digest skills)
env_requires:
  - name: TUMNIS_URL
    description: Tumnis's base URL, without /mcp (config.yaml's tumnis server)
    required: true
  - name: TUMNIS_TOKEN
    description: The master's own Tumnis key for cron jobs; a run gets its task token from the daemon
    required: true
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for the Jev MCP server (mcp.json); set it in the profile's .env
    required: true
