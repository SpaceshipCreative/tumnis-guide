# A Hybrid task: the agent drafts the invoice, the human checks and sends it.
id: enrich-hybrid-invoice
profile: project-template
skill: enrich
input: ../../recordings/enrich/hybrid_invoice.packet.json
output_schema: {family: enrichment, name: result, version: 1}
meta:
  test_id: T-P1-05-01
  req: [FR-5.2]
  wp: P1-05
  xfail: spec:P1-05
expect:
  tool_calls:
    allow: []
  rules: [enrichment_errors]
  json:
    - {path: "$.task_id", equals_input: "$.body.task.id"}
    - {path: "$.first_action", type: string, nonempty: true}
    - {path: "$.acceptance_criteria", type: array, min_items: 1, max_items: 6}
    - {path: "$.acceptance_criteria", each: [{path: "$", type: string, nonempty: true}]}
    - {path: "$.estimate_minutes", type: integer, between: [5, 480]}
    - {path: "$.hybrid_split.ai_portion", type: string, nonempty: true}
    - {path: "$.hybrid_split.human_portion", type: string, nonempty: true}
