# P2-16 (FR-8.4): what Quiet held while a task was In progress reaches the Discord channel
# at the next break as one message naming how many items waited and the review queue,
# with no item reference.
id: focus-batch-waiting
profile: master
skill: focus
input: ../../fixtures/packets/focus_batch.json
output_schema: {family: harness, name: focus_message, version: 1}
meta: {req: [FR-8.4], wp: P2-16, xfail: "spec:P2-16"}
expect:
  calls:
    - server: discord
      tool: send_message
      min: 1
      max: 1
      where:
        - {path: "$.target", equals: discord}
        - {path: "$.message", matches: "(?s).*\\b3\\b.*"}
        - {path: "$.message", matches: "(?s).*/review.*"}
  forbid:
    - {tool: record_human_reply}
    - {tool: pause_agents}
  json:
    - {path: "$.message", matches: "(?s).*\\b3\\b.*/review.*"}
