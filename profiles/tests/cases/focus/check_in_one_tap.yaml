# T-P2-16-02: a Coach check-in lists the four one-tap answers (FR-10.4) in the Discord
# message, with its attribution and the reference the relay skill reads.
id: focus-check-in-one-tap
profile: master
skill: focus
input: ../../fixtures/packets/focus_check_in.json
output_schema: {family: harness, name: focus_message, version: 1}
meta: {test_id: T-P2-16-02, req: [FR-10.3], wp: P2-16, xfail: "spec:P2-16"}
expect:
  calls:
    - server: discord
      tool: send_message
      min: 1
      max: 1
      where:
        - {path: "$.target", equals: discord}
        - {path: "$.message", matches: "(?s).*\\bstill_on_it\\b.*"}
        - {path: "$.message", matches: "(?s).*\\bswitched\\b.*"}
        - {path: "$.message", matches: "(?s).*\\bstuck\\b.*"}
        - {path: "$.message", matches: "(?s).*\\bsnooze\\b.*"}
        - {path: "$.message", matches: "(?s).*Coach · check_in_due.*"}
        - {path: "$.message", matches: "(?s).*ref focus:b9dbfeea-5a11-58d5-b8d5-dd226479aecb.*"}
  forbid:
    - {tool: record_human_reply}
    - {tool: pause_agents}
  json:
    - {path: "$.message", matches: "(?s).*\\bstill_on_it\\b.*\\bswitched\\b.*\\bstuck\\b.*\\bsnooze\\b.*"}
