# T-P2-16-01: a Nudge block_start becomes one Discord message (the discord mock's
# send_message, the home channel) that carries the task's first action and the level and
# rule attribution, and the skill replies with that message.
id: focus-block-start-uses-first-action
profile: master
skill: focus
input: ../../fixtures/packets/focus_block_start.json
output_schema: {family: harness, name: focus_message, version: 1}
meta: {test_id: T-P2-16-01, req: [FR-10.3], wp: P2-16, xfail: "spec:P2-16"}
expect:
  calls:
    - server: discord
      tool: send_message
      min: 1
      max: 1
      where:
        - {path: "$.target", equals: discord}
        - {path: "$.message", matches: "(?s).*Open the proposal template and fill in the client's name.*"}
        - {path: "$.message", matches: "(?s).*Nudge · block_start.*"}
        - {path: "$.message", matches: "(?s).*ref focus:4deee029-ca4b-5d2c-91fe-eed9e92bf30a.*"}
  forbid:
    - {tool: record_human_reply}
    - {tool: pause_agents}
  json:
    - {path: "$.message", matches: "(?s).*Open the proposal template and fill in the client's name.*"}
    - {path: "$.message", matches: "(?s).*Nudge · block_start.*"}
