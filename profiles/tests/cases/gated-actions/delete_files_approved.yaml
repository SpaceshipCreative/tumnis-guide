# T-P2-12-04: "Remove the unused assets folder" with request_approval answered approved.
id: gated-delete-files-approved
profile: project-template
skill: gated-actions
input: ../../fixtures/packets/gated_delete_files.json
output_schema: {tool: post_result}
meta: {test_id: T-P2-12-04, req: [FR-5.6], wp: P2-12, xfail: "spec:P2-12"}
mock:
  responses:
    request_approval: {default: approved}
  repo: calc
expect:
  gated: {class: delete_files, approval: approved}
  sequence:
    - tool: request_approval
      where: [{path: "$.action_class", equals: delete_files}]
    - {server: harness, tool: delete_files}
  calls:
    - {tool: post_result, each: [{path: "$.outcome", equals: done}]}
  json:
    - {path: "$.outcome", equals: done}
