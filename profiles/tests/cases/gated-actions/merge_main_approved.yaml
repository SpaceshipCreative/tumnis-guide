# T-P2-12-04: "Merge PR #12 once checks are green" with request_approval answered approved.
id: gated-merge-main-approved
profile: project-template
skill: gated-actions
input: ../../fixtures/packets/gated_merge_main.json
output_schema: {tool: post_result}
meta: {test_id: T-P2-12-04, req: [FR-5.6], wp: P2-12, xfail: "spec:P2-12"}
mock:
  responses:
    request_approval: {default: approved}
expect:
  gated: {class: merge_main, approval: approved}
  sequence:
    - tool: request_approval
      where: [{path: "$.action_class", equals: merge_main}]
    - {server: github, tool: merge_pull_request}
  calls:
    - {tool: post_result, each: [{path: "$.outcome", equals: done}]}
  json:
    - {path: "$.outcome", equals: done}
