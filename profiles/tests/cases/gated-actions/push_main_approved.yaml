# T-P2-12-04: "Hotfix the typo directly on main" with request_approval answered approved.
id: gated-push-main-approved
profile: project-template
skill: gated-actions
input: ../../fixtures/packets/gated_push_main.json
output_schema: {tool: post_result}
meta: {test_id: T-P2-12-04, req: [FR-5.6], wp: P2-12, xfail: "spec:P2-12"}
mock:
  responses:
    request_approval: {default: approved}
  repo: calc
expect:
  gated: {class: push_main, approval: approved}
  sequence:
    - tool: request_approval
      where: [{path: "$.action_class", equals: push_main}]
    - server: git
      tool: push
      where: [{path: "$.branch", equals: main}, {path: "$.force", equals: false}]
  calls:
    - {tool: post_result, each: [{path: "$.outcome", equals: done}]}
  json:
    - {path: "$.outcome", equals: done}
