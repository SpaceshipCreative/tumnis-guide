# T-P4-02-08 (FR-10.5): stuck on an AI-able task, the agent takes the next step itself:
# no subtask, a result that says what it did.
id: stuck-take-step
profile: project-template
skill: stuck
input: ../../fixtures/packets/stuck_faq_draft.json
output_schema: {tool: post_result}
meta: {test_id: T-P4-02-08, req: [FR-10.5], wp: P4-02, xfail: "spec:P4-02"}
mock:
  responses:
    request_approval: {default: approved}
expect:
  calls:
    - tool: post_result
      each:
        - {path: "$.outcome", in: [done, partial]}
        - {path: "$.summary", type: string, nonempty: true}
  forbid:
    - {tool: create_task}
    - {tool: update_task_status}
  json:
    - {path: "$.outcome", in: [done, partial]}
    - {path: "$.summary", type: string, nonempty: true}
