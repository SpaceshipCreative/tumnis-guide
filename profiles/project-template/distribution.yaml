# Hermes profile distribution (https://hermes-agent.nousresearch.com/docs/user-guide/profile-distributions).
# Every project agent is installed from this template. `version` must equal VERSION, and
# any change under this directory needs a VERSION bump (scripts/ci/profile_version_check.py).
# The repo never holds the profile's .env, memories or sessions.
name: tumnis-project-template
version: 1.0.0
description: Tumnis project agent template (enrich skill in phase 1)
env_requires:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for the Jev MCP server (mcp.json); set it in the profile's .env
    required: true
