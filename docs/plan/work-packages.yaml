  acceptance:
  - {id: A2.1, test: "Run an AI task: the packet reaches the fake runner, the log streams to the run view, the result lands in review; accept moves it to Done, reject returns it with the feedback as a comment", layer: Playwright, traces: "J3, FR-5.4, FR-5.5, FR-5.8"}
